<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galeri Kenangan Kelas 69D</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #f4f4f4;
    }
    header {
      background: #4a90e2;
      color: white;
      padding: 20px;
      text-align: center;
    }
    #loginForm, #uploadForm {
      max-width: 400px;
      margin: 20px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input[type="text"], input[type="password"], input[type="file"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
    }
    button {
      padding: 10px 20px;
      background: #4a90e2;
      color: white;
      border: none;
      cursor: pointer;
    }
    #gallery {
      max-width: 800px;
      margin: 20px auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .photo-card {
      background: white;
      padding: 10px;
      border-radius: 10px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      position: relative;
    }
    .photo-card img {
      width: 100%;
      height: auto;
      border-radius: 10px;
    }
    .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: red;
      color: white;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: none;
    }
    .owner .delete-btn {
      display: block;
    }
  </style>
</head>
<body>

<header>Galeri Kenangan Kelas 69D</header>

<div id="loginForm">
  <h3>Login</h3>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<div id="uploadForm" style="display:none;">
  <input type="file" id="photoUpload">
  <button onclick="uploadPhoto()">Upload Foto</button>
  <button onclick="logout()">Logout</button>
</div>

<div id="gallery"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // GANTI dengan project URL & anon key milikmu
  const SUPABASE_URL = "https://wddcmpwlclyfojndqgzb.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndkZGNtcHdsY2x5Zm9qbmRxZ3piIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTI2MjE4MTIsImV4cCI6MjA2ODE5NzgxMn0.jpufpZrhu41vhjJyXLILyBlxA-YthssR20V7duEH1ME";

  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const accounts = {
    "owner": "12345",
    "user": "abcde"
  };

  let role = "";

  function login() {
    const user = document.getElementById("username").value.trim().toLowerCase();
    const pass = document.getElementById("password").value.trim();
    if (accounts[user] === pass) {
      role = user;
      document.getElementById("loginForm").style.display = "none";
      document.getElementById("uploadForm").style.display = user === "owner" ? "block" : "none";
      loadGallery();
    } else {
      alert("Login gagal.");
    }
  }

  function logout() {
    location.reload();
  }

  async function uploadPhoto() {
    const file = document.getElementById("photoUpload").files[0];
    if (!file) return alert("Pilih file foto dahulu!");

    const fileName = Date.now() + "-" + file.name;
    const { error: uploadError } = await supabase.storage.from("photos").upload(fileName, file);
    if (uploadError) {
      alert("Gagal upload: " + uploadError.message);
      return;
    }

    const { data } = supabase.storage.from("photos").getPublicUrl(fileName);
    const publicUrl = data.publicUrl;

    await supabase.from("photos").insert([{ url: publicUrl }]);
    loadGallery();
  }

  async function loadGallery() {
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";

    let { data: photos, error } = await supabase.from("photos").select("*").order("uploaded_at", { ascending: false });
    if (error) return alert("Gagal memuat galeri");

    photos.forEach(photo => {
      const div = document.createElement("div");
      div.className = "photo-card" + (role === "owner" ? " owner" : "");
      div.innerHTML = \`
        <img src="\${photo.url}" alt="Kenangan">
        <button class="delete-btn" onclick="deletePhoto('\${photo.id}', '\${photo.url}')">✕</button>
      \`;
      gallery.appendChild(div);
    });
  }

  async function deletePhoto(id, url) {
    if (!confirm("Hapus foto ini?")) return;

    const fileName = decodeURIComponent(url.split("/").pop().split("?")[0]);
    await supabase.storage.from("photos").remove([fileName]);
    await supabase.from("photos").delete().eq("id", id);
    loadGallery();
  }
</script>

</body>
</html>
